<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 452" width="900" height="452" role="img" aria-label="Diagram comparing arm and leg bones, showing both follow the same one-bone, two-bone, many-bone sequence."><style>
  :root{--bg:#fafafa;--ink:#18181b;--mute:#71717a;--line:#c9c9cf;--fill:#e6e6ea;--bone:#dcdce0;--accent:#3f7cbf;--warm:#d97a2b;--gut:#bfa88f}
  @media (prefers-color-scheme: dark){:root{--bg:#131316;--ink:#f4f4f5;--mute:#a1a1aa;--line:#45454d;--fill:#28282e;--bone:#3a3a41;--accent:#6fa3dd;--warm:#e9a463;--gut:#6b5a49}}
  .t{font-family:system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;fill:var(--ink)}
  .h{font-size:20px;font-weight:600}.sm{font-size:15px;fill:var(--mute)}.b{font-weight:600}
  .bone{fill:var(--bone);stroke:var(--line);stroke-width:1.5}
  .g{stroke:var(--line);stroke-width:1.1;stroke-dasharray:3 4;fill:none}
  .ol{fill:none;stroke:var(--line);stroke-width:2}
</style><rect width="900" height="452" fill="var(--bg)"/><text class="t h" x="40" y="34">One limb plan, run twice</text><text class="t sm" x="40" y="56">Arm and leg are not two designs. They are the same sequence of parts, built by the same program.</text><text class="t sm" x="40" y="164">one bone</text><line class="g" x1="170" y1="102" x2="862" y2="102"/><text class="t sm" x="40" y="273">two bones</text><line class="g" x1="170" y1="212" x2="862" y2="212"/><text class="t sm" x="40" y="382">many bones</text><line class="g" x1="170" y1="320" x2="862" y2="320"/><text class="t sm b" x="300" y="96" text-anchor="middle">ARM</text><rect class="bone" x="278" y="118" width="44" height="82" rx="20"/><text class="t sm" x="342" y="164">humerus</text><rect class="bone" x="268" y="228" width="26" height="80" rx="12"/><rect class="bone" x="306"  y="228" width="26" height="80" rx="12"/><text class="t sm" x="350" y="272">radius + ulna</text><rect class="bone" x="266" y="336" width="18" height="18" rx="6"/><rect class="bone" x="290" y="336" width="18" height="18" rx="6"/><rect class="bone" x="314" y="336" width="18" height="18" rx="6"/><rect class="bone" x="254" y="362" width="12" height="42" rx="6"/><rect class="bone" x="276" y="362" width="12" height="49" rx="6"/><rect class="bone" x="298" y="362" width="12" height="56" rx="6"/><rect class="bone" x="320" y="362" width="12" height="49" rx="6"/><rect class="bone" x="342" y="362" width="12" height="42" rx="6"/><text class="t sm" x="372" y="398">wrist + fingers</text><text class="t sm b" x="620" y="96" text-anchor="middle">LEG</text><rect class="bone" x="598" y="118" width="44" height="82" rx="20"/><text class="t sm" x="662" y="164">femur</text><rect class="bone" x="588" y="228" width="26" height="80" rx="12"/><rect class="bone" x="626"  y="228" width="26" height="80" rx="12"/><text class="t sm" x="670" y="272">tibia + fibula</text><rect class="bone" x="586" y="336" width="18" height="18" rx="6"/><rect class="bone" x="610" y="336" width="18" height="18" rx="6"/><rect class="bone" x="634" y="336" width="18" height="18" rx="6"/><rect class="bone" x="574" y="362" width="12" height="42" rx="6"/><rect class="bone" x="596" y="362" width="12" height="49" rx="6"/><rect class="bone" x="618" y="362" width="12" height="56" rx="6"/><rect class="bone" x="640" y="362" width="12" height="49" rx="6"/><rect class="bone" x="662" y="362" width="12" height="42" rx="6"/><text class="t sm" x="692" y="398">ankle + toes</text></svg>