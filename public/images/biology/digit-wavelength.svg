</style><rect width="900" height="430" fill="var(--bg)"/><text class="t h" x="40" y="34">Digits are a wave, and Hox sets its wavelength</text><text class="t sm" x="40" y="56">Digits are not carved out one at a time. A chemical pattern makes regularly spaced peaks, and each peak becomes a digit.</text><text class="t sm" x="40" y="74">The distal Hox genes set the spacing. Reducing their dose in mice shortens it, producing more and thinner digits.</text><text class="t sm b" x="40" y="152">longer spacing</text><polyline points="190,148.0 194,144.5 198,141.0 202,137.7 206,134.6 210,131.8 214,129.4 218,127.4 222,125.8 226,124.7 230,124.1 234,124.0 238,124.5 242,125.5 246,126.9 250,128.8 254,131.2 258,133.9 262,136.9 266,140.2 270,143.6 274,147.1 278,150.7 282,154.1 286,157.5 290,160.6 294,163.5 298,166.0 302,168.2 306,169.9 310,171.1 314,171.8 318,172.0 322,171.7 326,170.8 330,169.5 334,167.7 338,165.4 342,162.8 346,159.9 350,156.7 354,153.3 358,149.8 362,146.2 366,142.7 370,139.3 374,136.1 378,133.2 382,130.6 386,128.3 390,126.5 394,125.2 398,124.3 402,124.0 406,124.2 410,124.9 414,126.1 418,127.8 422,130.0 426,132.5 430,135.4 434,138.5 438,141.9 442,145.3 446,148.9 450,152.4 454,155.8 458,159.1 462,162.1 466,164.8 470,167.2 474,169.1 478,170.5 482,171.5 486,172.0 490,171.9 494,171.3 498,170.2 502,168.6 506,166.6 510,164.2 514,161.4 518,158.3 522,155.0 526,151.5 530,148.0 534,144.5 538,141.0 542,137.7 546,134.6 550,131.8 554,129.4 558,127.4 562,125.8 566,124.7 570,124.1 574,124.0 578,124.5 582,125.5 586,126.9 590,128.8 594,131.2 598,133.9 602,136.9 606,140.2 610,143.6 614,147.1 618,150.7 622,154.1 626,157.5 630,160.6 634,163.5 638,166.0 642,168.2 646,169.9 650,171.1 654,171.8 658,172.0 662,171.7 666,170.8 670,169.5 674,167.7 678,165.4 682,162.8 686,159.9 690,156.7 694,153.3 698,149.8" fill="none" stroke="var(--accent)" stroke-width="2.4"/><rect x="215.5" y="180" width="34.0" height="26" rx="5.0" fill="var(--warm)"/><rect x="385.5" y="180" width="34.0" height="26" rx="5.0