<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" width="900" height="430" role="img" aria-label="Diagram showing that shortening the wavelength of a chemical pattern produces more, thinner digits."><style>
  :root{--bg:#fafafa;--ink:#18181b;--mute:#71717a;--line:#c9c9cf;--fill:#e6e6ea;--bone:#dcdce0;--accent:#3f7cbf;--warm:#d97a2b;--gut:#bfa88f}
