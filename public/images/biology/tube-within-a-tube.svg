<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" width="900" height="380" role="img" aria-label="Diagram of the bilaterian body plan: an outer body tube with an inner gut tube running through it, mouth at the front, anus at the rear."><style>
  :root{--bg:#fafafa;--ink:#18181b;--mute:#71717a;--line:#c9c9cf;--fill:#e6e6ea;--bone:#dcdce0;--accent:#3f7cbf;--warm:#d97a2b;--gut:#bfa88f}
  @media (prefers-color-scheme: dark){:root{--bg:#131316;--ink:#f4f4f5;--mute:#a1a1aa;--line:#45454d;--fill:#28282e;--bone:#3a3a41;--accent:#6fa3dd;--warm:#e9a463;--gut:#6b5a49}}
  .t{font-family:system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;fill:var(--ink)}
  .h{font-size:20px;font-weight:600}.sm{font-size:15px;fill:var(--mute)}.b{font-weight:600}
  .bone{fill:var(--bone);stroke:var(--line);stroke-width:1.5}
  .g{stroke:var(--line);stroke-width:1.1;stroke-dasharray:3 4;fill:none}
  .ol{fill:none;stroke:var(--line);stroke-width:2}
</style><rect width="900" height="380" fill="var(--bg)"/><text class="t h" x="40" y="34">The bilaterian body plan</text><text class="t sm" x="40" y="56">A tube inside a tube. Everything else in an animal is added on top of this.</text><text class="t sm" x="316" y="112" text-anchor="middle">nerve cord, thickened at the front</text><line class="g" x1="316" y1="121" x2="316" y2="174"/><text class="t sm" x="648" y="112" text-anchor="middle">body wall and muscle</text><line class="g" x1="648" y1="121" x2="648" y2="153"/><rect x="150" y="152" width="620" height="140" rx="70" fill="var(--fill)" stroke="var(--line)" stroke-width="2"/><rect x="138" y="200" width="644" height="44" rx="22" fill="var(--gut)"/><circle cx="152" cy="222" r="14" fill="var(--bg)"/><circle cx="768" cy="222" r="10" fill="var(--bg)"/><path d="M214 176 L742 176" stroke="var(--accent)" stroke-width="4" stroke-linecap="round" fill="none"/><ellipse cx="212" cy="176" rx="20" ry="13" fill="var(--accent)"/><line class="g" x1="152" y1="248" x2="152" y2="318"/><text class="t sm" x="152" y="340" text-anchor="middle">mouth</text><line class="g" x1="452" y1="248" x2="452" y2="318"/><text class="t sm" x="452" y="340" text-anchor="middle">gut &#8212; the inner tube</text><line class="g" x1="768" y1="248" x2="768" y2="318"/><text class="t sm" x="768" y="340" text-anchor="middle">anus</text></svg>