<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="900" height="560" role="img" aria-label="Diagram showing that Hox gene order along a chromosome matches the head-to-tail order of body regions in both a fly and a vertebrate."><style>
  :root{--bg:#fafafa;--ink:#18181b;--mute:#71717a;--line:#c9c9cf;--fill:#e6e6ea;--bone:#dcdce0;--accent:#3f7cbf;--warm:#d97a2b;--gut:#bfa88f}
  @media (prefers-color-scheme: dark){:root{--bg:#131316;--ink:#f4f4f5;--mute:#a1a1aa;--line:#45454d;--fill:#28282e;--bone:#3a3a41;--accent:#6fa3dd;--warm:#e9a463;--gut:#6b5a49}}
  .t{font-family:system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;fill:var(--ink)}
  .h{font-size:20px;font-weight:600}.sm{font-size:15px;fill:var(--mute)}.b{font-weight:600}
  .bone{fill:var(--bone);stroke:var(--line);stroke-width:1.5}
  .g{stroke:var(--line);stroke-width:1.1;stroke-dasharray:3 4;fill:none}
  .ol{fill:none;stroke:var(--line);stroke-width:2}
</style><rect width="900" height="560" fill="var(--bg)"/><text class="t h" x="40" y="34">Spatial colinearity</text><text class="t sm" x="40" y="56">The order of the genes along the chromosome is the order of the body regions they control &#8212;</text><text class="t sm" x="40" y="74">and the same ordering holds in animals as different as a fly and a mammal.</text><text class="t sm" x="40" y="128">chromosome</text><rect x="118" y="104" width="728" height="42" rx="8" fill="var(--fill)" stroke="var(--line)"/><rect x="126" y="111" width="86" height="28" rx="4" fill="#d94f4f"/><rect x="216" y="111" width="86" height="28" rx="4" fill="#d9803a"/><rect x="306" y="111" width="86" height="28" rx="4" fill="#c9a233"/><rect x="396" y="111" width="86" height="28" rx="4" fill="#5f9c46"/><rect x="486" y="111" width="86" height="28" rx="4" fill="#37988f"/><rect x="576" y="111" width="86" height="28" rx="4" fill="#3f7cbf"/><rect x="666" y="111" width="86" height="28" rx="4" fill="#6f5ab5"/><rect x="756" y="111" width="86" height="28" rx="4" fill="#ab4f94"/><text class="t sm" x="126" y="166">acts toward the head</text><text class="t sm" x="842" y="166" text-anchor="end">acts toward the tail</text><line class="g" x1="169.0" y1="174" x2="169.0" y2="208"/><line class="g" x1="259.0" y1="174" x2="259.0" y2="208"/><line class="g" x1="349.0" y1="174" x2="349.0" y2="208"/><line class="g" x1="439.0" y1="174" x2="439.0" y2="208"/><line class="g" x1="529.0" y1="174" x2="529.0" y2="208"/><line class="g" x1="619.0" y1="174" x2="619.0" y2="208"/><line class="g" x1="709.0" y1="174" x2="709.0" y2="208"/><line class="g" x1="799.0" y1="174" x2="799.0" y2="208"/><text class="t sm b" x="40" y="266">fly</text><clipPath id="fc"><path d="M132 244 C132 206 176 200 212 204 C286 196 372 202 452 210 C580 220 700 232 784 245 L784 279 C700 292 580 304 452 314 C372 322 286 328 212 320 C176 324 132 318 132 280 Z"/></clipPath><g clip-path="url(#fc)"><rect x="124.0" y="192" width="90" height="140" fill="#d94f4f"/><re